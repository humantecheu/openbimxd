[build-system]
requires      = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name            = "openbimxd"
description     = "Add your description here"
dynamic         = ["version"]
readme          = "README.md"
requires-python = ">=3.12"
license         = { file = "LICENSE" }

authors = [
    { name = "Fabian Kaufmann", email = "fabian.kaufmann@rptu.de" },
    { name = "Marius Schellen", email = "marius.schellen@rptu.de" },
    { name = "Mahdi Chamseddine", email = "mahdi.chamseddine@dfki.de" },
]

dependencies = [
    "ifcopenshell>=0.8.4",
    "numpy>=2.3.5",
    "open3d>=0.19.0",
    "pystruct3d @ https://github.com/humantecheu/pystruct3d.git",
    "scipy>=1.16.3",
]

[tool.uv.sources]
pystruct3d = { workspace = true }

[tool.pyright]
extraPaths = ["../pystruct3d/"]
