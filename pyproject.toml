[build-system]
requires      = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name            = "openbimxd"
description     = "Open-source Python library for IFC BIM interaction and scan-to-BIM workflows"
dynamic         = ["version"]
readme          = "README.md"
requires-python = ">=3.10,<3.13"
license         = { file = "LICENSE" }

authors = [
    { name = "Mahdi Chamseddine", email = "mahdi.chamseddine@dfki.de" },
    { name = "Fabian Kaufmann", email = "fabian.kaufmann@rptu.de" },
    { name = "Marius Schellen", email = "marius.schellen@rptu.de" },
]

dependencies = [
    "ifcopenshell",
    "numpy",
    "pystruct3d @ https://github.com/humantecheu/pystruct3d.git",
    "scipy",
]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.16.5",
    "ty>=0.0.44",
]

[tool.setuptools.packages.find]
include = ["openbimxd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude      = [".eggs", ".git", ".venv"]
line-length  = 88                         # same as black
indent-width = 4

[tool.ruff.format]
quote-style = "double"
preview     = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",    # line too long — formatter enforces line-length
    "PLR0913", # too many arguments — constructor parameters all carry meaningful defaults
    "PLR0917", # too many positional arguments — same rationale as PLR0913
    "CPY001",  # missing copyright notice — project does not use per-file copyright headers
    "ANN",     # type annotations — adopt gradually
    "ERA001",  # commented-out code — intentional TODOs and dev notes
    "T201",    # print — progress output; migrate to logging separately
    "FBT",     # boolean args — many are in ifcopenshell API calls
    "TD002",   # missing TODO author
    "TD003",   # missing TODO issue link
    "FIX002",  # line contains TODO
    "TRY300",  # consider try/except/else — style preference
    "COM812",  # trailing comma — conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]    # assert is idiomatic; tests don't need docstrings
"debug.py" = ["D100", "D103"] # script file — no module/function docstring required
"main.py"  = ["D100", "D103"] # script file — no module/function docstring required

[tool.ruff.lint.pydocstyle]
convention = "google"
